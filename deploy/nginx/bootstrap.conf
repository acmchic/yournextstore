# Loaded inside nginx http {} via /etc/nginx/conf.d/*.conf
server {
    listen 80;
    server_name teebravo.com admin.teebravo.com api.teebravo.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
