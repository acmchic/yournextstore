# Loaded inside nginx http {} via /etc/nginx/conf.d/*.conf
server {
    listen 80;
    server_name __PUBLIC_DOMAIN__ __ADMIN_DOMAIN__ __API_DOMAIN__;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
