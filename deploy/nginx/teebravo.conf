# Debian/Ubuntu, nginx http context. Certbot SAN certificate covers all 3 hosts.
server {
    listen 80;
    server_name __PUBLIC_DOMAIN__ __ADMIN_DOMAIN__ __API_DOMAIN__;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name __PUBLIC_DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location ^~ /_next/static/ {
        alias __SHARED_DIR__/next-static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:__STOREFRONT_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 90s;
        # Do not proxy_cache HTML/RSC/cart/checkout or override their Vary headers.
    }
}
server {
    listen 443 ssl;
    server_name __ADMIN_DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root __SHARED_DIR__/admin-public;
    index index.php;
    client_max_body_size 32m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /storage/ { alias __SHARED_DIR__/admin-storage/app/public/; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/admin/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/admin/public;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:__SHARED_DIR__/php/fpm.sock;
        fastcgi_read_timeout 120s;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
}
server {
    listen 443 ssl;
    server_name __API_DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
        # API emits its own image cache headers. Never cache JSON/mutations here.
    }
}
