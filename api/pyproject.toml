[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pod-mockup-api"
version = "0.1.0"
description = "On-demand POD mockup rendering API"
requires-python = ">=3.11"
dependencies = [
  "aiomysql>=0.2.0",
  "cairosvg>=2.7.1",
  "cryptography>=43.0.0",
  "fastapi>=0.116.0",
  "numpy>=2.0.0,<2.3",
  "opencv-python-headless>=4.10.0.84,<5.0.0",
  "pillow>=10.4.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "ruff>=0.6.0",
  "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
